name: Frontend Unit Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "2-web-app/**"
      - "2-web-app/.github/workflows/unit-tests.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "2-web-app/**"
      - "2-web-app/.github/workflows/unit-tests.yml"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2-web-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: 2-web-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit
