# Frontend unit tests — runs when app or test code changes.
# Repo root = frontend app (src/, __tests__/, package.json). No working-directory needed.

name: Frontend Unit Tests

on:
  push:
    branches: [main, develop, feature/webapp-ui]
    paths:
      - "src/**"
      - "__tests__/**"

  pull_request:
    branches: [main, develop, feature/webapp-ui]
    paths:
      - "src/**"
      - "__tests__/**"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit
