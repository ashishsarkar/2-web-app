# Frontend CI Pipeline — Full Security + Build + Sign Pipeline
#
# Required GitHub Secrets:
# HARBOR_REGISTRY (e.g. harbor.example.com)
# HARBOR_PROJECT  (e.g. library)
# HARBOR_USERNAME, HARBOR_PASSWORD (or robot account token)
# COSIGN_PRIVATE_KEY, COSIGN_PASSWORD
# DEFECTDOJO_URL, DEFECTDOJO_API_KEY, DEFECTDOJO_ENGAGEMENT_ID
# DTRACK_URL, DTRACK_API_KEY
# MINIO_ENDPOINT, MINIO_ACCESS_KEY, MINIO_SECRET_KEY
# NVD_API_KEY
# SLACK_WEBHOOK_SEC_ALERTS, SLACK_WEBHOOK_BUILD_ALERTS, SLACK_WEBHOOK_DEV_ALERTS
# REKOR_SERVER (optional — defaults to https://rekor.sigstore.dev)

name: Frontend CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "develop"
      - "release/**"
      - "feature/**"
  pull_request:
    branches:
      - "main"
      - "develop"
      - "release/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/frontend-app
  NODE_VERSION: "20"
  COVERAGE_THRESHOLD: "80"
  TRIVY_SEVERITY: "CRITICAL,HIGH"
  FAIL_ON_SEVERITY: "CRITICAL"
  OWASP_FAIL_CVSS: "9"

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # GROUP 1 — Source Code Analysis
  # Batch 1 (parallel): 1.1, 1.2, 1.3
  # Batch 2 (sequential): 1.4 waits for 1.3
  # Batch 3 (parallel): 1.5, 1.6, 1.7 wait for 1.4
  # ═══════════════════════════════════════════════════════════════════════════

  secrets-scan:
    name: "1.1 | Secrets Scan — Gitleaks"
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --report-format sarif --report-path gitleaks-report.sarif --exit-code 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-report.sarif
          category: secrets-scanning

      - name: Upload to MinIO
        if: always()
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/darwin-arm64/mc -o mc && chmod +x mc
          ./mc alias set minio "${{ secrets.MINIO_ENDPOINT }}" \
            "${{ secrets.MINIO_ACCESS_KEY }}" "${{ secrets.MINIO_SECRET_KEY }}"
          ./mc cp gitleaks-report.sarif \
            "minio/ci-reports/${{ github.repository }}/${{ github.sha }}/gitleaks-report.sarif"

      - name: Slack alert on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_SEC_ALERTS }}
          payload: |
            {"text":"🚨 SECRETS DETECTED in `${{ github.repository }}` — Branch: `${{ github.ref_name }}` — Commit: `${{ github.sha }}` — Pipeline BLOCKED"}

  # ─────────────────────────────────────────────────────────────────────────

  lint-typecheck:
    name: "1.2 | Lint + Type Check — ESLint / tsc"
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install ESLint SARIF formatter
        run: npm install --no-save @microsoft/eslint-formatter-sarif

      - name: Run ESLint
        run: npx eslint . --format @microsoft/eslint-formatter-sarif --output-file eslint-report.sarif || true

      - name: Run Prettier check
        run: npx prettier --check . || true

      - name: Run TypeScript type check
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit || true
          else
            echo "No tsconfig.json found — skipping TypeScript type check"
          fi

      - name: Upload SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-report.sarif
          category: eslint

      - name: Upload to MinIO
        if: always()
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/darwin-arm64/mc -o mc && chmod +x mc
          ./mc alias set minio "${{ secrets.MINIO_ENDPOINT }}" \
            "${{ secrets.MINIO_ACCESS_KEY }}" "${{ secrets.MINIO_SECRET_KEY }}"
          ./mc cp eslint-report.sarif \
            "minio/ci-reports/${{ github.repository }}/${{ github.sha }}/eslint-report.sarif"

  # ─────────────────────────────────────────────────────────────────────────

  npm-audit:
    name: "1.3 | Fast SCA — npm audit"
    runs-on: [self-hosted, macOS]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run npm audit
        run: npm audit --audit-level=critical --json > npm-audit-report.json || true

      - name: Upload to MinIO
        if: always()
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/darwin-arm64/mc -o mc && chmod +x mc
          ./mc alias set minio "${{ secrets.MINIO_ENDPOINT }}" \
            "${{ secrets.MINIO_ACCESS_KEY }}" "${{ secrets.MINIO_SECRET_KEY }}"
          ./mc cp npm-audit-report.json \
            "minio/ci-reports/${{ github.repository }}/${{ github.sha }}/npm-audit-report.json"

  # ─────────────────────────────────────────────────────────────────────────

  sca-scan:
    name: "1.4 | Full SCA — OWASP Dependency-Check"
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    needs: [npm-audit]
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      - name: Install OWASP Dependency-Check
        run: |
          brew install dependency-check 2>/dev/null || true

      - name: Run OWASP Dependency-Check
        run: |
          mkdir -p owasp-reports
          dependency-check \
            --project "frontend-app" \
            --scan . \
            --format ALL \
            --out owasp-reports \
            --failOnCVSS ${{ env.OWASP_FAIL_CVSS }} \
            --enableRetired \
            --nvdApiKey ${{ secrets.NVD_API_KEY }} \
            --data ~/.dependency-check/data || true

      - name: Upload SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: owasp-reports/dependency-check-report.sarif
          category: sca-owasp

      - name: Import to DefectDojo
        if: always()
        run: |
          curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Dependency Check Scan" \
            -F "file=@owasp-reports/dependency-check-report.xml" \
            -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
            -F "active=true" \
            -F "verified=false" \
            -F "close_old_findings=true"

      - name: Upload to MinIO
        if: always()
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/darwin-arm64/mc -o mc && chmod +x mc
          ./mc alias set minio "${{ secrets.MINIO_ENDPOINT }}" \
            "${{ secrets.MINIO_ACCESS_KEY }}" "${{ secrets.MINIO_SECRET_KEY }}"
          ./mc cp --recursive owasp-reports/ \
            "minio/ci-reports/${{ github.repository }}/${{ github.sha }}/owasp/"

      - name: Slack alert on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_SEC_ALERTS }}
          payload: |
            {"text":"🚨 CRITICAL CVE FOUND (SCA) in `${{ github.repository }}` — Branch: `${{ github.ref_name }}` — Check DefectDojo"}

  # ─────────────────────────────────────────────────────────────────────────

  license-scan:
    name: "1.5 | License Compliance — license-checker"
    needs: [sca-scan, secrets-scan, lint-typecheck]
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Generate license report
        run: npx license-checker --production --json --out license-report.json

      - name: Check for prohibited licenses
        run: npx license-checker --production --failOn "GPL;AGPL;LGPL;SSPL;EUPL;CPAL;OSL" || true

      - name: Upload to MinIO
        if: always()
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/darwin-arm64/mc -o mc && chmod +x mc
          ./mc alias set minio "${{ secrets.MINIO_ENDPOINT }}" \
            "${{ secrets.MINIO_ACCESS_KEY }}" "${{ secrets.MINIO_SECRET_KEY }}"
          ./mc cp license-report.json \
            "minio/ci-reports/${{ github.repository }}/${{ github.sha }}/license-report.json"

  # ─────────────────────────────────────────────────────────────────────────

  sast-scan:
    name: "1.6 | SAST — Semgrep"
    needs: [sca-scan, secrets-scan, lint-typecheck]
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: python3 -m pip install semgrep==1.86.0 --break-system-packages 2>/dev/null || python3 -m pip install semgrep==1.86.0

      - name: Run Semgrep (JSON report)
        id: semgrep-json
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/xss \
            --config p/owasp-top-ten \
            --json --output semgrep-report.json \
            --error

      - name: Run Semgrep (SARIF report)
        if: always()
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/xss \
            --config p/owasp-top-ten \
            --sarif --output semgrep-report.sarif || true

      - name: Upload SARIF to GitHub Security Tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-report.sarif
          category: sast-semgrep

      - name: Import to DefectDojo
        if: always()
        run: |
          curl -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Semgrep JSON Report" \
            -F "file=@semgrep-report.json" \
            -F "engagement=${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}" \
            -F "active=true" \
            -F "verified=false"

      - name: Upload to MinIO
        if: always()
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/darwin-arm64/mc -o mc && chmod +x mc
          ./mc alias set minio "${{ secrets.MINIO_ENDPOINT }}" \
            "${{ secrets.MINIO_ACCESS_KEY }}" "${{ secrets.MINIO_SECRET_KEY }}"
          ./mc cp semgrep-report.sarif \
            "minio/ci-reports/${{ github.repository }}/${{ github.sha }}/semgrep-report.sarif"
          ./mc cp semgrep-report.json \
            "minio/ci-reports/${{ github.repository }}/${{ github.sha }}/semgrep-report.json"

      # Fail step disabled for testing — re-enable when enforcing SAST
      # - name: Fail if Semgrep found issues
      #   if: steps.semgrep-json.outcome == 'failure'
      #   run: exit 1

      - name: Slack alert on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_DEV_ALERTS }}
          payload: |
            {"text":"⚠️ SAST FAILURE (Semgrep) in `${{ github.repository }}` — Branch: `${{ github.ref_name }}` — Review GitHub Security Tab"}

  # ─────────────────────────────────────────────────────────────────────────

  sbom-source:
    name: "1.7 | SBOM (Source) — Syft"
    needs: [sca-scan, secrets-scan, lint-typecheck]
    runs-on: [self-hosted, macOS]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: |
          syft dir:. \
            --output cyclonedx-json=sbom-source.cdx.json \
            --output spdx-json=sbom-source.spdx.json

      - name: Upload to Dependency-Track
        run: |
          curl -X POST "${{ secrets.DTRACK_URL }}/api/v1/bom" \
            -H "X-Api-Key: ${{ secrets.DTRACK_API_KEY }}" \
            -F "autoCreate=true" \
            -F "projectName=frontend-app" \
            -F "projectVersion=${{ github.ref_name }}" \
            -F "bom=@sbom-source.cdx.json" || true

      - name: Upload to MinIO
        if: always()
        run: |
          curl -fsSL https://dl.min.io/client/mc/release/darwin-arm64/mc -o mc && chmod +x mc
          ./mc alias set minio "${{ secrets.MINIO_ENDPOINT }}" \
            "${{ secrets.MINIO_ACCESS_KEY }}" "${{ secrets.MINIO_SECRET_KEY }}"
          ./mc cp sbom-source.cdx.json \
            "minio/ci-reports/${{ github.repository }}/${{ github.sha }}/sbom-source.cdx.json"
          ./mc cp sbom-source.spdx.json \
            "minio/ci-reports/${{ github.repository }}/${{ github.sha }}/sbom-source.spdx.json"

      - name: Upload as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-source
          path: |
            sbom-source.cdx.json
            sbom-source.spdx.json
          retention-days: 90

